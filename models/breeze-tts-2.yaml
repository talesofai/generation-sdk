schema: neta.generation.model.v1
model: breeze-tts-2
title: Breeze TTS 2
description: 'Modes: meta.instruction only = voice design; one reference audio + meta.ref_text = voice clone; both = voice direction. ref_text must be the reference audio''s exact transcript (no server-side ASR). Bilingual EN/ZH, supports inline vocal events like (laugh)/[叹气] in the spoken text. Weights are research/non-commercial-licensed; self-hosting for commercial traffic is a known, accepted risk. Conflict: ask user; never combine/reinterpret modes. Dependency: clone prior generated audio.'
adapter:
  type: openai.audioSpeech
content:
  input:
    - type: text
      required: true
      min: 1
      max: 1
      description: Exactly one non-empty text block to speak.
    - type: audio
      required: false
      max: 1
      sources:
        - url
      description: 'Clone/direction: one reference audio URL, requires meta.ref_text. Design: omit. Dependency: use prior generated audio.'
meta:
  fields:
    instruction:
      type: string
      optional: true
      description: 'Design/direction: natural-language voice description or direction, e.g. a warm calm female voice / speak faster with rising excitement. Required if no reference audio is provided.'
    ref_text:
      type: string
      optional: true
      description: The reference audio's EXACT transcript. Required whenever reference audio is provided; there is no server-side ASR fallback.
    cfg_scale:
      type: number
      optional: true
      description: Instruction-following strength. Positive number.
    seed:
      type: integer
      optional: true
      description: Generation seed.
examples:
  - title: Voice design
    request:
      model: breeze-tts-2
      content:
        - type: text
          text: (sigh) It is good to hear your voice again after all this time.
      meta:
        instruction: a warm, calm female voice speaking softly
  - title: Voice clone
    request:
      model: breeze-tts-2
      content:
        - type: text
          text: 这是一次清晰自然的语音合成测试。
        - type: audio
          source:
            type: url
            url: https://example.com/reference.mp3
      meta:
        ref_text: 这是参考音频的准确文字稿。
  - title: Voice direction
    request:
      model: breeze-tts-2
      content:
        - type: text
          text: 这是一次清晰自然的语音合成测试。
        - type: audio
          source:
            type: url
            url: https://example.com/reference.mp3
      meta:
        ref_text: 这是参考音频的准确文字稿。
        instruction: 说快一点，带着上扬的兴奋感
