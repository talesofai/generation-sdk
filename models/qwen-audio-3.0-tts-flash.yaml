schema: neta.generation.model.v1
model: qwen-audio-3.0-tts-flash
title: Qwen Audio 3.0 TTS Flash
description: Qwen Audio 3.0 Flash text-to-speech with voice design or reference-audio cloning.
adapter:
  type: openai.audioSpeech
content:
  input:
    - type: text
      required: true
      min: 1
      max: 1
      description: The single text block to speak.
    - type: audio
      required: false
      max: 1
      sources:
        - url
      description: Optional HTTP(S) reference audio for voice cloning.
meta:
  fields:
    voice_prompt:
      type: string
      optional: true
      description: Voice design description. Mutually exclusive with reference audio.
examples:
  - title: Voice design
    request:
      model: qwen-audio-3.0-tts-flash
      content:
        - type: text
          text: 这是一段长度足够并且表达清晰自然的语音合成测试文本。
      meta:
        voice_prompt: 一位沉稳干练的男性播音员声音，吐字清晰有力
  - title: Voice clone
    request:
      model: qwen-audio-3.0-tts-flash
      content:
        - type: text
          text: 这是一段长度足够并且表达清晰自然的语音合成测试文本。
        - type: audio
          source:
            type: url
            url: https://example.com/reference.mp3
