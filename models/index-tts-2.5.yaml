schema: neta.generation.model.v1
model: index-tts-2.5
title: IndexTTS-2.5
description: 'Voice-cloning only: exactly one reference audio always required, no from-text-only design mode. Optional: separate emotion reference audio, explicit emotion vector (meta.emo_vector: array of exactly 8 finite numbers [happy, angry, sad, afraid, disgusted, melancholic, surprised, calm], not declared as a typed meta field since this schema has no array meta-field type), auto-emotion-from-text, speed control (0.5-2.0), language. Dependency: clone prior generated audio.'
adapter:
  type: openai.audioSpeech
content:
  input:
    - type: text
      required: true
      min: 1
      max: 1
      description: Exactly one non-empty text block to speak.
    - type: audio
      required: true
      min: 1
      max: 1
      sources:
        - url
      description: 'Required: single reference audio used for voice cloning (there is no design-only mode). Dependency: use prior generated audio.'
meta:
  fields:
    lang:
      type: string
      optional: true
      description: 'Language code: ZH, EN, JA, ES, or AR. Default: ZH.'
    emo_audio_url:
      type: string
      optional: true
      description: 'Separate reference audio URL used only for emotion (distinct from the voice-identity reference in content).'
    emo_alpha:
      type: number
      optional: true
      description: 'Emotion intensity in [0, 1]. Requires emo_audio_url.'
    use_emo_text:
      type: boolean
      optional: true
      description: Derive emotion automatically from emo_text (or the spoken text itself if emo_text is omitted).
    emo_text:
      type: string
      optional: true
      description: Text used only for emotion derivation when use_emo_text is true; does not affect the spoken content.
    duration_factor:
      type: number
      optional: true
      description: 'Speed control in [0.5, 2.0]. >1.0 slows down, <1.0 speeds up. Default: 1.0.'
examples:
  - title: Reference-audio voice clone
    request:
      model: index-tts-2.5
      content:
        - type: text
          text: 使用参考音频克隆音色朗读这段文本。
        - type: audio
          source:
            type: url
            url: https://example.com/reference.mp3
  - title: Voice clone with explicit emotion vector and slower speech
    request:
      model: index-tts-2.5
      content:
        - type: text
          text: 这是一段带情感控制和语速调整的测试文本。
        - type: audio
          source:
            type: url
            url: https://example.com/reference.mp3
      meta:
        lang: ZH
        emo_vector: [0, 0, 0.8, 0, 0, 0, 0, 0.2]
        duration_factor: 1.2
