schema: neta.generation.model.v1
model: seedance-2-0
title: Seedance 2.0
description: High-quality video generation model that accepts text, image, and video inputs. Supports resolutions from 480p to 2K and is well suited to final deliverables.
adapter:
  type: ark.videoGenerations
content:
  input:
    - type: text
      required: true
      min: 1
      max: 16
      merge: newline
      description: Video prompt.
    - type: image
      required: false
      max: 9
      sources:
        - url
      roles:
        - first_frame
        - last_frame
        - reference_image
      description: Optional public URL image input. Use meta.role as first_frame, last_frame, or reference_image.
    - type: video
      required: false
      max: 1
      sources:
        - url
      roles:
        - reference_video
      roleRequired: true
      description: Optional public URL reference video input. Use meta.role as reference_video.
parameters:
  duration:
    type: integer
    optional: true
    default: 5
    min: 4
    max: 15
    description: Video duration in seconds.
  resolution:
    type: string
    optional: true
    default: 1080p
    enum: [480p, 720p, 1080p, 2K]
    description: Output video resolution.
  ratio:
    type: string
    optional: true
    default: "16:9"
    enum: ["16:9", "9:16"]
    description: Supported output aspect ratios are 16:9 and 9:16.
  aspect_ratio:
    type: string
    optional: true
    enum: ["16:9", "9:16"]
    description: Deprecated compatibility alias for ratio. Use ratio.
  fps:
    type: integer
    optional: true
    default: 30
    min: 1
    max: 60
    description: Frames per second.
  seed:
    type: integer
    optional: true
    description: Random seed for reproducibility.
  generate_audio:
    type: boolean
    optional: true
    default: true
    description: Generate synchronized audio.
  return_last_frame:
    type: boolean
    optional: true
    default: true
    description: Return the last frame as an image for chaining video segments.
  camera_fixed:
    type: boolean
    optional: true
    default: false
    description: Fix camera position when supported.
  watermark:
    type: boolean
    optional: true
    default: false
    description: Add AI Generated watermark.
  poll_interval:
    type: integer
    optional: true
    default: 2
    min: 1
    max: 30
    description: Seconds between task status checks.
  max_wait:
    type: integer
    optional: true
    default: 900
    min: 30
    max: 1800
    description: Maximum seconds to wait for task completion.
examples:
  - title: Text to video
    request:
      model: seedance-2-0
      content:
        - type: text
          text: a cat playing piano in a cozy jazz club, cinematic lighting, smooth camera movement
      parameters:
        duration: 5
        resolution: 1080p
        ratio: "16:9"
