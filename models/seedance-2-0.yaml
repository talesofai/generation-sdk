schema: neta.generation.model.v1
model: seedance-2-0
title: Seedance 2.0
category: video
description: High-quality video generation model that accepts text, image, and video inputs. Supports resolutions from 480p to 2K and is well suited to final deliverables.
adapter:
  type: ark.videoGenerations
content:
  input:
    - type: text
      required: true
      min: 1
      max: 16
      merge: newline
      description: Video prompt.
    - type: image
      required: false
      max: 9
      sources:
        - url
      roles:
        - first_frame
        - last_frame
        - reference_image
      description: Optional public URL image input. Use meta.role as first_frame, last_frame, or reference_image.
    - type: video
      required: false
      max: 1
      sources:
        - url
      roles:
        - reference_video
      roleRequired: true
      description: Optional public URL reference video input. Use meta.role as reference_video.
parameters:
  duration:
    type: integer
    optional: true
    default: 5
    min: 4
    max: 15
    description: Video duration in seconds.
  resolution:
    type: string
    optional: true
    default: 1080p
    enum: [480p, 720p, 1080p, 2K]
    description: Output video resolution.
  ratio:
    type: string
    optional: true
    default: "16:9"
    enum: ["16:9", "9:16", "1:1", "4:3", "3:2", "2:3", "3:4", "21:9", adaptive]
    description: Output aspect ratio. Use adaptive to let the model choose.
  seed:
    type: integer
    optional: true
    description: Random seed for reproducibility.
  camera_fixed:
    type: boolean
    optional: true
    default: false
    description: Fix camera position when supported.
  poll_interval:
    type: integer
    optional: true
    default: 1
    min: 1
    max: 30
    description: Seconds between task status checks.
  max_wait:
    type: integer
    optional: true
    default: 900
    min: 30
    max: 1800
    description: Maximum seconds to wait for task completion.
examples:
  - title: Text to video
    request:
      model: seedance-2-0
      content:
        - type: text
          text: a cat playing piano in a cozy jazz club, cinematic lighting, smooth camera movement
      parameters:
        duration: 5
        resolution: 1080p
        ratio: "16:9"
