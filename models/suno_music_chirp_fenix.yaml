schema: neta.generation.model.v1
model: suno_music_chirp_fenix
title: Suno Music Chirp Fenix v5.5
category: audio
description: High-quality music generation model for soundtracks and background music. Produces two MP3 tracks and two JPG cover images per request.
adapter:
  type: suno.tasks
  operation: music
  payload:
    mv: chirp-fenix
content:
  input:
    - type: text
      required: true
      max: 16
      merge: newline
      description: Prompt text. The adapter maps merged text to the operation's text field when that field is not provided.
parameters:
  poll_interval:
    type: integer
    optional: true
    default: 5
    min: 1
    max: 60
    description: Seconds between task status checks.
  max_wait:
    type: integer
    optional: true
    default: 600
    min: 30
    max: 3600
    description: Maximum seconds to wait for task completion.
meta:
  fields:
    title:
      type: string
      optional: true
      description: Suno song title.
    tags:
      type: string
      optional: true
      description: Comma-separated Suno music style tags.
    gpt_description_prompt:
      type: string
      optional: true
      description: Suno inspiration-mode prompt.
    lyrics:
      type: string
      optional: true
      description: Explicit lyrics; omit to let Suno write lyrics from the prompt.
    negative_tags:
      type: string
      optional: true
      description: Styles to avoid.
    generation_type:
      type: string
      optional: true
      description: Suno generation type.
    make_instrumental:
      type: boolean
      optional: true
      default: false
      description: Generate instrumental music.
    metadata:
      type: object
      optional: true
      description: Suno provider metadata payload.
    metadata_params:
      type: object
      optional: true
      description: Suno task-specific metadata payload.
examples:
  - title: Music generation
    request:
      model: suno_music_chirp_fenix
      content:
        - type: text
          text: uplifting cinematic pop with warm piano and clear chorus
      meta:
        title: Warm Horizon
        tags: cinematic pop, warm piano
        make_instrumental: false
