schema: neta.generation.model.v1
model: cosyvoice-v3.5-plus
title: CosyVoice v3.5 Plus
description: "Modes: voice_prompt design OR one-reference clone. Text: >=15 Unicode code points (design mode: <=200).
  Conflict: ask user; never combine/reinterpret. Dependency: clone prior generated audio."
adapter:
  type: openai.audioSpeech
content:
  input:
    - type: text
      required: true
      min: 1
      max: 1
      description: Exactly one non-empty text block to speak, with at least 15 Unicode code points (at most 200 in
        voice-design mode).
    - type: audio
      required: false
      max: 1
      sources:
        - url
      description: "Clone: one URL; no voice_prompt. Dependency: use prior generated audio."
meta:
  fields:
    voice_prompt:
      type: string
      optional: true
      description: "Design: custom voice text; no reference audio."
examples:
  - title: Voice design
    request:
      model: cosyvoice-v3.5-plus
      content:
        - type: text
          text: 这是一段长度足够并且表达清晰自然的语音合成测试文本。
      meta:
        voice_prompt: 一位沉稳干练的男性播音员声音，吐字清晰有力
  - title: Voice clone
    request:
      model: cosyvoice-v3.5-plus
      content:
        - type: text
          text: 这是一段长度足够并且表达清晰自然的语音合成测试文本。
        - type: audio
          source:
            type: url
            url: https://example.com/reference.mp3
